function normName(s){if(!s)return"";return String(s).trim().replace(/\s+/g," ").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[\u064B-\u065F]/g,"")}
function isFriday(d){return new Date(d).getDay()===5}

// يجلب راتب/سعر الموظف الصالح لشهر معين
function getEmpRate(emp,year,month){
  if(!emp||!emp.rateHistory||!emp.rateHistory.length)return emp;
  var key=String(year)+"-"+String(month).padStart(2,"0");
  var hits=emp.rateHistory.filter(function(h){return h.from<=key}).sort(function(a,b){return b.from.localeCompare(a.from)});
  if(!hits.length)return emp;
  var h=hits[0];
  return Object.assign({},emp,{
    baseSalary:h.baseSalary!=null?h.baseSalary:emp.baseSalary,
    hourlyRate:h.hourlyRate!=null?h.hourlyRate:emp.hourlyRate,
    overtimeRate:h.overtimeRate!=null?h.overtimeRate:emp.overtimeRate,
    hoursPerDay:h.hoursPerDay!=null?h.hoursPerDay:emp.hoursPerDay
  });
}
function getActiveAllowances(emp,year,month){
  if(!emp||!emp.allowances||!emp.allowances.length)return[];
  var key=String(year)+"-"+String(month).padStart(2,"0");
  return emp.allowances.filter(function(a){
    if(a.type==="permanent")return true;
    if(a.type==="once")return a.month===key;
    if(a.type==="duration"){
      if(!a.from)return false;
      var endY=parseInt(a.from.split("-")[0]),endM=parseInt(a.from.split("-")[1])+(parseInt(a.months)||1)-1;
      while(endM>12){endM-=12;endY++;}
      var endKey=String(endY)+"-"+String(endM).padStart(2,"0");
      return a.from<=key&&key<=endKey;
    }
    return false;
  });
}
function fuzzyFindInList(raw,list){
  if(!raw||!list||!list.length)return null;
  var norm=normName(raw);
  var exact=list.find(function(e){return normName(e.name)===norm});
  if(exact)return{emp:exact,score:100,type:"exact"};
  var partial=list.find(function(e){var en=normName(e.name);return en.includes(norm)||norm.includes(en)||en.split(" ").some(function(w){return w.length>2&&norm.includes(w)})||norm.split(" ").some(function(w){return w.length>2&&en.includes(w)})});
  if(partial)return{emp:partial,score:75,type:"partial"};
  var best=null,bestScore=0;
  list.forEach(function(e){var en=normName(e.name);if(Math.abs(en.length-norm.length)>4)return;var m2=0;for(var j=0;j<Math.min(en.length,norm.length);j++)if(en[j]===norm[j])m2++;var s2=Math.round((m2/Math.max(en.length,norm.length,1))*100);if(s2>60&&s2>bestScore){bestScore=s2;best=e}});
  if(best)return{emp:best,score:bestScore,type:"fuzzy"};
  return null;
}
function autoBackup(d,label){
  try{
    var key="payroll_bk_"+new Date().toISOString().replace(/[:.]/g,"-").slice(0,19)+"_"+label;
    var mini=JSON.stringify({ts:new Date().toISOString(),label:label,employees:d.employees,attendance:d.attendance,transactions:d.transactions,payments:d.payments});
    localStorage.setItem(key,mini);
    var keys=Object.keys(localStorage).filter(function(k){return k.startsWith("payroll_bk_")}).sort();
    if(keys.length>10)keys.slice(0,keys.length-10).forEach(function(k){localStorage.removeItem(k)});
    return key;
  }catch(e2){return null}
}

const FB_CFG_KEY="payroll_fb_config";
let _fbApp=null,_fbDb=null,_fbRef=null,_fbWriteTimer=null,_fbIgnoreNext=false,_fbReady=false;
function fbCfgLoad(){try{var r=localStorage.getItem(FB_CFG_KEY);return r?JSON.parse(r):null}catch{return null}}
function fbCfgSave(c){try{localStorage.setItem(FB_CFG_KEY,JSON.stringify(c))}catch{}}
function fbWrite(d){
  if(!_fbRef||!_fbReady)return;
  clearTimeout(_fbWriteTimer);
  _fbWriteTimer=setTimeout(function(){
    _fbIgnoreNext=true;
    var clean=JSON.parse(JSON.stringify(d));
    // أضف معلومات آخر تحديث
    try{var un=localStorage.getItem("payroll_username")||"مستخدم";clean._updatedBy=un;clean._updatedAt=Date.now();}catch{}
    _fbRef.set(clean).catch(function(e){console.error("FB write:",e);_fbIgnoreNext=false});
  },1500);
}
function fbDestroy(){
  if(_fbRef){try{_fbRef.off()}catch{}_fbRef=null}
  if(_fbApp){try{_fbApp.delete()}catch{}_fbApp=null}
  _fbDb=null;_fbReady=false;
}
function fbInit(cfg,onData,onStatus){
  fbDestroy();
  if(!cfg||!cfg.databaseURL||!cfg.apiKey){onStatus&&onStatus("no_cfg");return}
  try{
    _fbApp=firebase.initializeApp(cfg,"payroll_"+Date.now());
    _fbDb=firebase.database(_fbApp);
    _fbRef=_fbDb.ref("payroll_v11");
    onStatus&&onStatus("connecting");
    _fbRef.on("value",function(snap){
      if(_fbIgnoreNext){_fbIgnoreNext=false;return}
      var val=snap.val();
      _fbReady=true;
      onStatus&&onStatus("connected");
      if(val&&typeof val==="object"&&val.settings){
        onData(val);
      }
    },function(err){
      console.error("FB read:",err);
      onStatus&&onStatus("error:"+err.message);
    });
    // Connection state monitor
    _fbDb.ref(".info/connected").on("value",function(s){
      if(!s.val())onStatus&&onStatus("offline");
      else if(_fbReady)onStatus&&onStatus("connected");
    });
  }catch(e){
    console.error("FB init:",e);
    onStatus&&onStatus("error:"+e.message);
  }
}

function analyzeRow(row,employees,projects,existingAtt,cfg){
  var nameRaw=String(row[0]||"").trim();
  var dateRaw=String(row[1]||"").trim();
  var projRaw=String(row[2]||"").trim();
  var statusRaw=String(row[3]||"حاضر").trim();
  var otRaw=Number(row[4])||0;
  var hrsRaw=Number(row[5])||0;
  var issues=[],warns=[];
  if(!nameRaw)return{ok:false,skip:true,nameRaw:nameRaw,dateRaw:dateRaw,projRaw:projRaw,issues:["اسم فارغ"],warns:[],cost:0,statusCode:"skip"};
  var empMatch=fuzzyFindInList(nameRaw,employees);
  if(!empMatch)return{ok:false,skip:false,nameRaw:nameRaw,dateRaw:dateRaw,projRaw:projRaw,issues:["موظف غير موجود: "+nameRaw],warns:[],cost:0,statusCode:"error"};
  if(empMatch.type!=="exact")warns.push("اسم تقريبي ("+empMatch.score+"%) ← "+empMatch.emp.name);
  if(!dateRaw||isNaN(new Date(dateRaw).getTime()))return{ok:false,skip:false,nameRaw:nameRaw,dateRaw:dateRaw,projRaw:projRaw,emp:empMatch.emp,issues:["تاريخ خاطئ: "+dateRaw],warns:warns,cost:0,statusCode:"error"};
  if(new Date(dateRaw)>new Date())warns.push("تاريخ مستقبلي");
  var projMatch=fuzzyFindInList(projRaw,projects);
  if(!projMatch)return{ok:false,skip:false,nameRaw:nameRaw,dateRaw:dateRaw,projRaw:projRaw,emp:empMatch.emp,issues:["مشروع غير موجود: "+projRaw],warns:warns,cost:0,statusCode:"error"};
  if(projMatch.type!=="exact")warns.push("مشروع تقريبي ("+projMatch.score+"%) ← "+projMatch.emp.name);
  var isDup=existingAtt.some(function(a){return a.employeeId===empMatch.emp.id&&a.date===dateRaw});
  if(isDup)return{ok:false,skip:false,dup:true,nameRaw:nameRaw,dateRaw:dateRaw,projRaw:projRaw,emp:empMatch.emp,proj:projMatch.emp,issues:[],warns:["مكرر — موجود مسبقاً"],cost:0,statusCode:"dup"};
  var emp=empMatch.emp;
  var isAbs=statusRaw==="غائب"||statusRaw==="absent";
  var isFri=isFriday(dateRaw); // هل التاريخ يوم جمعة؟
  var cost=0;
  if(emp.type==="salary"){
    var dr=(emp.baseSalary||0)/(cfg.daysPerMonth||30);
    var hr2=dr/(emp.hoursPerDay||8);
    var otH=emp.overtimeRate>0?emp.overtimeRate:rn(hr2*(cfg.overtimeMultiplier||1.5));
    if(isAbs){
      cost=0; // غائب — لا تكلفة
    } else if(isFri){
      // يوم الجمعة: كل ساعاته إضافية بدون حد أقصى
      var friHrs=otRaw||hrsRaw||0; // الساعات في خانة الإضافي أو الساعات
      if(friHrs===0)warns.push("🕌 الجمعة بـ0 ساعات — تأكد");
      cost=rn(friHrs*otH);
    } else {
      // يوم عادي: تحقق من الإضافي
      if(otRaw>(emp.hoursPerDay||8))issues.push("إضافي "+otRaw+"س > يوم "+(emp.hoursPerDay||8)+"س");
      cost=rn(dr+otRaw*otH);
    }
  } else if(emp.type==="hourly"){
    if(hrsRaw===0&&!isAbs)issues.push("ساعات=0 — لن يُحتسب راتب");
    if(hrsRaw>16)warns.push("ساعات مرتفعة "+hrsRaw+"س");
    cost=rn(hrsRaw*(emp.hourlyRate||0));
  }
  var statusCode=issues.length>0?"error":warns.length>0?"warn":"ok";
  return{ok:statusCode==="ok"||statusCode==="warn",dup:false,skip:false,nameRaw:nameRaw,dateRaw:dateRaw,projRaw:projRaw,statusRaw:statusRaw,otRaw:otRaw,hrsRaw:hrsRaw,emp:empMatch.emp,proj:projMatch.emp,issues:issues,warns:warns,cost:cost,statusCode:statusCode};
}

// نظام التحقق من صحة ساعات العمل
// ══════════════════════════════════════════════
function attValidate(emp,date,status,overtime,hours,friHours,fM,fY,cfg){
  const errs=[],warns=[];
  if(!emp||!date)return{errs,warns};
  const d=new Date(date);
  const today=new Date();today.setHours(23,59,59,0);
  const recM=d.getMonth()+1,recY=d.getFullYear();

  // خطأ: تاريخ مستقبلي
  if(d>today)errs.push("📅 التاريخ في المستقبل — تحقق من التاريخ");
  // تحذير: خارج الشهر المحدد
  if(recM!==fM||recY!==fY)warns.push("📅 التاريخ ("+recM+"/"+recY+") خارج الشهر المحدد ("+fM+"/"+fY+")");

  if(emp.type==="salary"){
    const ot=Number(overtime)||0;
    const base=emp.hoursPerDay||8;
    const dr=(emp.baseSalary||0)/(cfg.daysPerMonth||30);
    const hr=dr/base;
    const otHr=emp.overtimeRate&&emp.overtimeRate>0?emp.overtimeRate:rn(hr*(cfg.overtimeMultiplier||1.5));

    // خطأ: إضافي يتجاوز ساعات اليوم كاملاً
    if(ot>base*1.5)errs.push("⚡ إضافي ("+ot+"س) أكبر من ساعات يوم ونصف — خطأ مرجح");
    // تحذير: إضافي كثير
    else if(ot>base)warns.push("⚡ إضافي ("+ot+"س) يتجاوز ساعات اليوم ("+base+"س) — تأكد");
    else if(ot>base*0.75)warns.push("⚡ إضافي مرتفع ("+ot+"س) — راجع");

    // خطأ: يوم جمعة لكن غير مصنّف صحيح
    if(isFriday(date)&&status!=="friday"&&status!=="fri_absent"&&status!=="absent")
      errs.push("🕌 التاريخ يوم جمعة لكنه مسجّل كحضور عادي — يجب تصنيفه كجمعة");
    // خطأ: مصنّف جمعة لكن التاريخ ليس جمعة
    if(!isFriday(date)&&(status==="friday"||status==="fri_absent"))
      errs.push("❌ الحالة مضبوطة على 'جمعة' لكن التاريخ ليس جمعة");

    // ساعات الجمعة
    if(status==="friday"){
      const fh=Number(friHours)||0;
      if(fh===0)warns.push("🕌 ساعات الجمعة = 0 — لن يُحتسب أي مبلغ");
      if(fh>14)errs.push("🕌 ساعات الجمعة ("+fh+"س) مرتفعة جداً — تحقق");
      else if(fh>base)warns.push("🕌 ساعات الجمعة ("+fh+"س) تتجاوز ساعات اليوم ("+base+"س)");
    }
    // تأثير مالي مرتفع جداً
    const impact=status==="friday"?rn((Number(friHours)||base)*otHr):status==="present"?rn(dr+ot*otHr):0;
    if(impact>emp.baseSalary*0.15)warns.push("💰 هذا السجل الواحد = "+rn(impact,0).toLocaleString()+" "+cfg.currency+" ("+rn((impact/emp.baseSalary)*100,0)+"% من الراتب)");
  } else {
    const h=Number(hours)||0;
    // خطأ: صفر ساعات لموظف بالساعة
    if(h===0)errs.push("⏰ ساعات = 0 — الموظف لن يحصل على أي مبلغ");
    // خطأ: ساعات مفرطة
    if(h>16)errs.push("⏰ "+h+" ساعة في يوم واحد — مستحيل عادةً، تحقق");
    else if(h>12)warns.push("⏰ "+h+" ساعة في يوم واحد — كثير، راجع");
    // تأثير مالي
    const impact=rn(h*(emp.hourlyRate||0));
    if(impact>(emp.hourlyRate||0)*16*1.5)warns.push("💰 تكلفة مرتفعة: "+impact.toLocaleString()+" "+cfg.currency);
  }
  return{errs,warns};
}

function attCost(emp,status,overtime,hours,friHours,cfg){
  if(!emp)return 0;
  if(emp.type==="salary"){
    const dr=(emp.baseSalary||0)/(cfg.daysPerMonth||30);
    const hr=dr/(emp.hoursPerDay||8);
    const otHr=emp.overtimeRate&&emp.overtimeRate>0?emp.overtimeRate:rn(hr*(cfg.overtimeMultiplier||1.5));
    if(status==="friday"||status==="fri_absent"){const fh=Number(friHours)||0;return rn(fh*otHr)}
    if(status==="present"){const ot=Number(overtime)||0;return rn(dr+ot*otHr)}
    return 0;
  }
  return rn((Number(hours)||0)*(emp.hourlyRate||0));
}

catch{}try{const w=window.open("","_blank","width=900,height=700");if(w){w.document.open();w.document.write(doc);w.document.close();return}}catch{}alert("السماح بالنوافذ المنبثقة مطلوب")}

const cP=pr?.cashPaid||0,bP=pr?.bankPaid||0,tP=cP+bP;
const dLoc=pr?.deliveryLocation||"";
if(emp.type==="salary"){
const nonFriRecs=recs.filter(r=>r.status==="present");

const abs=recs.filter(r=>r.status==="absent").length;
const friHrs=friRecs.reduce((s,r)=>s+(typeof r.friHours==="number"?r.friHours:Number(r.friHours)||0),0);
const normOT=nonFriRecs.reduce((s,r)=>s+(r.overtime||0),0);
const ot=normOT+friHrs;
// استخدم الراتب المحفوظ وقت التسجيل إن وُجد (لمنع تأثير التغيير على الأشهر السابقة)

const effOTRate=snap?.overtimeRate??emp.overtimeRate;

const hr=dr/(effHPD||8);

const op=rn(ot*otHr);
const allowAmt=prs>0?getActiveAllowances(empRaw,fY,fM).reduce(function(s,a){return s+(a.amount||0)},0):0;
const g=rn(bp+op+bon),n=rn(g-ded-adv+allowAmt),rem=rn(n-tP);

const pC={};const totalPresent=prs+(friRecs.length)||1;Object.entries(pD).forEach(([p,d])=>{pC[p]=rn((d/totalPresent)*n)});
return{emp,present:prs,absent:abs,totalOT:ot,normOT,fridayDays:friRecs.length,fridayHours:friHrs,basePay:bp,otPay:op,otHourlyRate:otHr,bonus:bon,deduction:ded,advance:adv,allowancesTotal:allowAmt,allowances:getActiveAllowances(empRaw,fY,fM),gross:g,net:n,cashPaid:cP,bankPaid:bP,totalPaid:tP,remaining:rem,deliveryLocation:dLoc,recs,pCosts:pC,pDays:pD,totalHours:0,pHours:{}}}

const selE=data.employees.find(e=>e.id===fm.employeeId);
const cls=()=>{setFm({employeeId:"",date:"",projectId:"",status:"present",overtime:"0",hours:"0",friHours:""});setEi(null);setSh(false)};
const clsKeepFilter=()=>{setFm({employeeId:"",date:"",projectId:"",status:"present",overtime:"0",hours:"0",friHours:""});setEi(null);setSh(false)};
const flt=mA.filter(a=>{if(fE&&a.employeeId!==fE)return false;if(fD&&a.date!==fD)return false;if(fP&&a.projectId!==fP)return false;if(vt!=="all"){const emp=data.employees.find(e=>e.id===a.employeeId);if(emp&&emp.type!==vt)return false}return true}).sort((a,b)=>b.date.localeCompare(a.date));
const doSave=()=>{
  if(!fm.employeeId||!fm.date||!fm.projectId){nt("ملء مطلوب","err");return}
  const emp=data.employees.find(e=>e.id===fm.employeeId);
  if(!emp){nt("موظف غير موجود","err");return}
  if(data.attendance.find(a=>a.employeeId===fm.employeeId&&a.date===fm.date&&a.id!==ei)){nt("سجل موجود لهذا الموظف في هذا اليوم","err");return}
  const isFri=isFriday(fm.date);
  const{errs,warns}=attValidate(emp,fm.date,fm.status,fm.overtime,fm.hours,fm.friHours,fM,fY,cfg);
  const cost=attCost(emp,isFri?(fm.status==="absent"?"fri_absent":"friday"):fm.status,fm.overtime,fm.hours,fm.friHours,cfg);
  // إذا لا أخطاء ولا تحذيرات — حفظ مباشر
  if(errs.length===0&&warns.length===0){doFinalSave();return}
  // وإلا: أظهر نافذة التأكيد
  setConfData({emp,date:fm.date,status:fm.status,isFri,errs,warns,cost});setConfChecked(false);
};

const doFinalSave=()=>{
  const emp=data.employees.find(e=>e.id===fm.employeeId);if(!emp)return;
  const isFri=isFriday(fm.date);
  // حفظ لقطة الأسعار وقت التسجيل — لمنع تأثير تغيير الراتب على الأشهر السابقة
  const rateSnap=emp.type==="salary"
    ?{baseSalary:emp.baseSalary,overtimeRate:emp.overtimeRate,hoursPerDay:emp.hoursPerDay}
    :{hourlyRate:emp.hourlyRate};
  up(d=>{let r;if(emp.type==="salary"){if(isFri){const fh=fm.status==="absent"?-1:(fm.friHours===""?emp.hoursPerDay||8:Number(fm.friHours));r={id:ei||gid(),employeeId:fm.employeeId,date:fm.date,projectId:fm.projectId,status:fm.status==="absent"?"fri_absent":"friday",overtime:0,hours:0,baseHours:0,friHours:fh<0?0:fh,_snap:rateSnap}}else{r={id:ei||gid(),employeeId:fm.employeeId,date:fm.date,projectId:fm.projectId,status:fm.status,overtime:fm.status==="present"?Number(fm.overtime)||0:0,hours:emp.hoursPerDay||8,baseHours:emp.hoursPerDay||8,friHours:0,_snap:rateSnap}}}else{r={id:ei||gid(),employeeId:fm.employeeId,date:fm.date,projectId:fm.projectId,status:"present",overtime:0,hours:Number(fm.hours)||0,baseHours:0,friHours:0,_snap:rateSnap}}if(ei){const i=d.attendance.findIndex(a=>a.id===ei);if(i>=0)d.attendance[i]=r}else d.attendance.push(r)});
  addLog(ei?"تعديل دوام":"إضافة دوام",emp.name+" — "+fd(fm.date));
  nt(ei?"تم التحديث":"تم التسجيل");setConfData(null);clsKeepFilter();
};
// ─── مساعدات الواجهة ───
const getRowWarn=(r,emp)=>{if(!emp||!r)return null;const ot=r.overtime||0;const base=emp.hoursPerDay||8;
if(emp.type==="salary"){if(isFriday(r.date)&&r.status!=="friday"&&r.status!=="fri_absent")return"err";if(!isFriday(r.date)&&(r.status==="friday"||r.status==="fri_absent"))return"err";if(ot>base)return"err";if(ot>base*0.5)return"warn";return null}
const h=r.hours||0;if(h===0)return"err";if(h>12)return"warn";return null};
const liveCost=selE&&fm.date?attCost(selE,isFriday(fm.date)?(fm.status==="absent"?"fri_absent":"friday"):fm.status,fm.overtime,fm.hours,fm.friHours,cfg):0;
const liveVal=selE&&fm.date?attValidate(selE,fm.date,fm.status,fm.overtime,fm.hours,fm.friHours,fM,fY,cfg):{errs:[],warns:[]};

})());

});

});

const allCollapsed=Object.keys(pc).every(pid=>collapsed[pid]);

const grouped=[];let lastDate="";filt.forEach(l=>{const d=l.date?l.date.slice(0,10):"";if(d!==lastDate){grouped.push({type:"sep",date:d});lastDate=d}grouped.push({type:"item",log:l})});
const today=new Date().toISOString().slice(0,10);const todayCnt=logs.filter(l=>l.date?.slice(0,10)===today).length;

</div>
<div style={{fontSize:11,color:T.tm,fontFamily:"monospace",flexShrink:0}}>{time}</div>
</div>})}
{filt.length>200&&<div style={{textAlign:"center",padding:16,fontSize:12,color:T.tm,borderTop:"1px solid "+T.bd}}>يعرض أول 200 نتيجة — ضيّق البحث لرؤية المزيد</div>}
</div>}
</div>
</div>};
